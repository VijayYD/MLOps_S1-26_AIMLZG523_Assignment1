name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt

      - name: ruff check + format
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the two real environments this project targets: the Mac
        # dev machine (3.13.5) and the BITS Prayogshala lab (3.12.9).
        python-version: ["3.12.9", "3.13.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests (JUnit XML + coverage XML/HTML)
        run: |
          set -euo pipefail
          pytest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/

  train:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Download and clean data (falls back to the committed cleaned CSV if UCI is unreachable)
        run: |
          set -euo pipefail
          if python -m heart_mlops.data.download && python -m heart_mlops.data.clean; then
            echo "Downloaded and cleaned fresh data from UCI."
          else
            echo "::warning::UCI download/clean failed -- falling back to the committed data/processed/heart_combined_clean.csv"
            if [ ! -f data/processed/heart_combined_clean.csv ]; then
              echo "::error::No committed cleaned CSV available as a fallback -- cannot proceed."
              exit 1
            fi
          fi

      - name: Train (tunes, selects, logs to MLflow, packages the model)
        run: |
          set -euo pipefail
          python -m heart_mlops.models.train

      - name: Write metrics summary
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json
          import os

          with open("models/model_metadata.json") as f:
              metadata = json.load(f)

          lines = [
              f"### Selected model: `{metadata['model_name']}` (registry v{metadata['model_version']})",
              "",
              f"Threshold: `{metadata['threshold']:.4f}`",
              "",
              "| Metric | Value |",
              "|---|---|",
          ]
          for key, value in metadata["metrics"].items():
              formatted = f"{value:.4f}" if isinstance(value, float) else str(value)
              lines.append(f"| {key} | {formatted} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts
          path: |
            models/heart_model.joblib
            models/model_metadata.json
            reports/figures/
            mlflow.db
            mlartifacts/

  docker:
    # Builds from the repo's *committed* models/heart_model.joblib (Docker
    # has no reason to wait for `train`'s freshly-generated-but-not-committed
    # artifact -- see docs/DECISIONS.md D5.2/D5.3 on why the committed
    # artifact is the one that matters for a fresh clone) -- `needs: [test]`
    # is the real gate; `train` is left out on purpose so a flaky/slow UCI
    # download never blocks the container smoke test.
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run container smoke test
        run: |
          set -euo pipefail
          bash scripts/run_container_smoke.sh

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-log
          path: screenshots/logs/run_container_smoke_*.log

      # Only push to GHCR for real commits on main (not every PR run), and
      # only once the smoke test above has already passed for this exact
      # image. GHCR image paths must be lowercase, so the owner is
      # lower-cased explicitly rather than trusting github.repository_owner's
      # casing.
      - name: Compute GHCR image name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR_IMAGE=ghcr.io/${owner_lower}/heart-mlops-api" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse HEAD)"
          IMAGE_NAME="${GHCR_IMAGE}" IMAGE_TAG="${GIT_SHA}" bash scripts/build_image.sh
          docker tag "${GHCR_IMAGE}:${GIT_SHA}" "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:${GIT_SHA}"
          docker push "${GHCR_IMAGE}:latest"
