# Shared by docker-compose and Kubernetes. Tells Grafana to auto-load any
# dashboard JSON file placed in /var/lib/grafana/dashboards -- no manual
# "import dashboard" clicking.
apiVersion: 1
providers:
  - name: default
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
