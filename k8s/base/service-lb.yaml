# Gets a real external IP once `minikube tunnel` is running (any OS);
# scripts/k8s_verify.sh falls back to `kubectl port-forward` otherwise.
apiVersion: v1
kind: Service
metadata:
  name: heart-api-lb
spec:
  type: LoadBalancer
  selector:
    app: heart-api
  ports:
    - port: 8000
      targetPort: 8000
